# RAG 사용 전후 비교용 대표 질문
# - 근거 없이 답하면 틀리기 쉬운 질문으로 골랐다 (연도별 규정 혼동, 판정 번복, 세부 수치).
# - reference(참고 답안)는 채점 기준이다. 공개 전에 위키백과·FIA 문서로 한 번 더 확인할 것.
# - season + gp(영문 그랑프리 이름)로 races.json 에서 경기 ID를 찾는다.
# - expect_unknown: true 인 질문은 문서에 없는 내용이라 '확인되지 않는다'고 답해야 맞다.

questions:
  - id: q1
    season: 2021
    gp: Abu Dhabi Grand Prix
    mode: ruling
    question: 마지막 랩 직전 세이프티카 재출발 절차는 왜 논란이 됐나?
    reference: >-
      니콜라스 라티피의 사고로 세이프티카가 나왔다. 레이스 디렉터 마이클 마시는 해밀턴과 베르스타펜 사이의
      랩 다운 차량만 추월(언랩)을 허용했고, 마지막 한 랩을 남기고 곧바로 경기를 재개했다. 모든 랩 다운 차량이
      추월한 뒤 다음 랩 끝에 세이프티카가 들어오는 규정 절차와 달랐다는 점이 논란이었다. 새 타이어의 베르스타펜이
      마지막 랩에 해밀턴을 추월해 우승하고 챔피언이 되었으며, 메르세데스의 항의는 기각되었다.

  - id: q2
    season: 2021
    gp: Belgian Grand Prix
    mode: qa
    question: 이 경기는 왜 절반 포인트만 줬고, 다음 시즌 규정은 어떻게 바뀌었나?
    reference: >-
      폭우로 세이프티카 뒤에서 몇 랩만 돌고 경기가 끝나 규정 거리의 75%를 채우지 못해 절반 포인트가 주어졌다
      (우승 베르스타펜, 2위 러셀, 3위 해밀턴). 2022년부터는 그린 플래그 상태로 일정 랩 이상을 달려야 포인트를 주고,
      달린 거리 비율에 따라 단계별로 포인트를 주도록 바뀌었다.

  - id: q3
    season: 2022
    gp: Emilia Romagna Grand Prix
    mode: qa
    question: 이 시즌 스프린트에서는 몇 위까지 포인트를 받았고, 2021 시즌과 무엇이 달랐나?
    reference: >-
      2022 시즌 스프린트는 1위 8점부터 8위 1점까지 상위 8명이 포인트를 받았다. 2021 시즌 스프린트 예선은
      상위 3명만 3·2·1점을 받았다.

  - id: q4
    season: 2021
    gp: British Grand Prix
    mode: ruling
    question: 첫 랩 충돌에 대해 어떤 페널티가 나왔고 결과에 어떤 영향을 줬나?
    reference: >-
      첫 랩 코프스 코너에서 해밀턴과 베르스타펜이 부딪혀 베르스타펜이 리타이어했다. 심판은 해밀턴에게 10초 시간
      페널티를 주었고, 해밀턴은 페널티를 받고도 경기에서 우승했다.

  - id: q5
    season: 2023
    gp: Saudi Arabian Grand Prix
    mode: factcheck
    question: 페르난도 알론소는 이 경기에서 페널티 때문에 포디움을 잃었다.
    reference: >-
      거짓에 가깝다. 알론소는 그리드 위치 위반으로 5초 페널티를 받았고, 페널티를 수행하는 동안 차에 잭이 닿았다는
      이유로 경기 후 10초 페널티가 추가되어 4위로 내려갔다가, 애스턴 마틴의 재심 청구가 받아들여져 페널티가
      취소되고 3위가 회복되었다. 최종적으로 포디움을 지켰다.

  - id: q6
    season: 2021
    gp: São Paulo Grand Prix
    mode: qa
    question: 해밀턴은 이 경기에서 몇 번째로 출발했고 왜 그렇게 뒤에서 출발했나?
    reference: >-
      해밀턴은 DRS 리어 윙 기술 규정 위반으로 예선 기록이 실격되어 스프린트를 맨 뒤에서 출발했고, 엔진 교체로
      5계단 그리드 페널티도 받아 결선은 10위에서 출발했다. 그럼에도 결선에서 우승했다.

  - id: q7
    season: 2022
    gp: Japanese Grand Prix
    mode: ruling
    question: 경기가 단축됐는데도 전체 포인트를 준 이유와 그 결과는?
    reference: >-
      폭우로 경기가 중단·단축되어 규정 거리의 75%를 채우지 못했지만, 경기가 체커 깃발 아래(재개 후 정상 종료)
      끝났기 때문에 단계별 감점 규정이 적용되지 않는다는 해석으로 전체 포인트가 주어졌다. 이로써 베르스타펜이 두 번째
      드라이버 챔피언을 확정했다. 이후 규정 문구가 다시 고쳐졌다.

  - id: q8
    season: 2023
    gp: Austrian Grand Prix
    mode: qa
    question: 이 경기에서 트랙 리밋 문제가 왜 크게 불거졌나?
    reference: >-
      경기 중 트랙 리밋 위반 신고가 1,200건 이상 나와 많은 랩 기록이 삭제되었고, 경기 후 애스턴 마틴의 항의로
      심판이 추가 검토해 여러 드라이버에게 시간 페널티를 주며 최종 결과가 바뀌었다.

  - id: q9
    season: 2023
    gp: Saudi Arabian Grand Prix
    mode: qa
    expect_unknown: true
    question: 우승자가 체커기를 받은 직후 팀 라디오에서 한 첫 문장을 그대로 알려줘.
    reference: 수집 문서에 팀 라디오 전문은 없으므로 문서에서 확인되지 않는다고 답해야 한다.

  - id: q10
    season: 2021
    gp: Abu Dhabi Grand Prix
    mode: qa
    expect_unknown: true
    question: 이 경기 관중석 입장권의 평균 가격은 얼마였나?
    reference: 수집 문서에 입장권 가격 정보는 없으므로 문서에서 확인되지 않는다고 답해야 한다.
