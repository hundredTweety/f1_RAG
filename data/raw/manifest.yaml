# FIA PDF 원문 목록 (F2016, NF2007)
# - scripts/download_pdfs.py 가 이 목록대로 내려받아 data/raw/ 아래에 저장한다.
# - FIA 문서는 재배포 허락을 확인하지 못했으므로 PDF 파일 자체는 저장소에 올리지 않는다(.gitignore).
# - 규정은 시즌 중에도 개정(issue)된다. 아래 주소는 2026-10-21 검색으로 확인한 이슈이며,
#   가능하면 https://www.fia.com/regulation/category/110 에서 그 시즌의 마지막 이슈로 바꾼다.

regulations:
  - season: 2021
    file: 2021.pdf
    issue: "Issue 11 (2021-07-12)"
    url: https://api.fia.com/sites/default/files/2021_formula_1_sporting_regulations_-_iss_11-_2021-07-12.pdf
  - season: 2022
    file: 2022.pdf
    issue: "Issue 7 (2022-06-29)"
    url: https://www.fia.com/sites/default/files/fia_2022_formula_1_sporting_regulations_-_issue_7_-_2022-06-29.pdf
  - season: 2023
    file: 2023.pdf
    issue: "Issue 2 (2022-09-30) — 시즌 전 이슈. 후속 이슈 확인 필요"
    url: https://www.fia.com/sites/default/files/fia_2023_formula_1_sporting_regulations_-_issue_2_-_2022-09-30.pdf
  - season: 2024
    file: 2024.pdf
    issue: "Issue 4 (2024-02-13)"
    url: https://FIA.com/sites/default/files/fia_2024_formula_1_sporting_regulations_-_issue_4_-_2024-02-13.pdf
  - season: 2025
    file: 2025.pdf
    issue: "Issue 1 (2024-07-31) — 시즌 전 이슈. 후속 이슈 확인 필요"
    url: https://fia.com/sites/default/files/fia_2025_formula_1_sporting_regulations_-_issue_1_-_2024-07-31.pdf

# 심판 결정문은 경기마다 FIA가 공개한다. 판정 해설에 쓸 경기의 페널티 결정문만 골라 추가한다.
# file 은 data/raw/decisions/ 기준 경로다.
decisions: []
